<!DOCTYPE html><html lang="ko" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오류</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link th:href="@{/css/app.css}" rel="stylesheet"></head><body><main class="container py-5" style="max-width:640px"><div class="card shadow-sm"><div class="card-body p-5 text-center"><div class="eyebrow" th:text="${status} + ' ' + ${error}">404 Not Found</div><h1 th:text="${status == 400 ? '잘못된 요청입니다.' : (message != null and message != '' and message != 'No message available' ? message : '요청을 처리할 수 없습니다.')}">요청을 처리할 수 없습니다.</h1><p class="text-secondary mt-3" th:text="${path}">/path</p><a class="btn btn-primary mt-2" th:href="@{/posts}">목록으로 돌아가기</a></div></div></main></body></html>
